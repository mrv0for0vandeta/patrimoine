# Fly.io Configuration for Moroccan Heritage Survey Platform

app = "patrimoine-survey"
primary_region = "fra"

[build]
  [build.env]
    NODE_ENV = "production"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  DATABASE_PATH = "/data/survey_platform.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[mounts]
  source = "survey_data"
  destination = "/data"
  initial_size = "3gb"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

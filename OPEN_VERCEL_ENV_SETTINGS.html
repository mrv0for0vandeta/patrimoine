<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh"
        content="0; url=https://vercel.com/mrv0for0vandeta/patrimoine-jet/settings/environment-variables">
    <title>Opening Vercel Environment Variables...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        h1 {
            margin: 0 0 20px 0;
        }

        .loader {
            margin: 20px auto;
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        a {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🚀 Opening Vercel Settings...</h1>
        <div class="loader"></div>
        <p>If the page doesn't open automatically, click below:</p>
        <p><a href="https://vercel.com/mrv0for0vandeta/patrimoine-jet/settings/environment-variables">Open Environment
                Variables Settings</a></p>
    </div>
</body>

</html>
